<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <linearGradient id="bg" x1="180" y1="40" x2="860" y2="980" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#128A6A"/>
      <stop offset="0.55" stop-color="#0A7A5C"/>
      <stop offset="1" stop-color="#075F48"/>
    </linearGradient>
    <linearGradient id="paper" x1="240" y1="220" x2="780" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFEFA"/>
      <stop offset="1" stop-color="#F1EEE6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="512" y1="120" x2="512" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#04382B" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- macOS squircle base -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)" filter="url(#softShadow)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#sheen)"/>

  <!-- document card -->
  <rect x="214" y="214" width="596" height="596" rx="72" fill="url(#paper)"/>
  <rect x="214" y="214" width="596" height="596" rx="72" stroke="#0A7A5C" stroke-opacity="0.08" stroke-width="4"/>

  <!-- dual-pane divider -->
  <rect x="506" y="268" width="10" height="488" rx="5" fill="#0A7A5C" fill-opacity="0.18"/>

  <!-- left: markdown source lines -->
  <g fill="#0A7A5C" fill-opacity="0.78">
    <rect x="268" y="300" width="168" height="22" rx="11"/>
    <rect x="268" y="352" width="196" height="16" rx="8" fill-opacity="0.42"/>
    <rect x="268" y="390" width="176" height="16" rx="8" fill-opacity="0.32"/>
    <rect x="268" y="428" width="188" height="16" rx="8" fill-opacity="0.42"/>
    <rect x="268" y="466" width="140" height="16" rx="8" fill-opacity="0.28"/>
    <rect x="268" y="520" width="196" height="16" rx="8" fill-opacity="0.36"/>
    <rect x="268" y="558" width="160" height="16" rx="8" fill-opacity="0.28"/>
    <rect x="268" y="596" width="184" height="16" rx="8" fill-opacity="0.36"/>
    <rect x="268" y="650" width="120" height="16" rx="8" fill-opacity="0.24"/>
  </g>
  <!-- hash marks suggesting markdown headings -->
  <g fill="#3DCF9A">
    <rect x="268" y="300" width="34" height="22" rx="8"/>
    <rect x="268" y="520" width="26" height="16" rx="8"/>
  </g>

  <!-- right: rendered prose blocks -->
  <g fill="#1C1C1C" fill-opacity="0.72">
    <rect x="556" y="300" width="186" height="28" rx="10"/>
    <rect x="556" y="360" width="210" height="14" rx="7" fill-opacity="0.34"/>
    <rect x="556" y="392" width="198" height="14" rx="7" fill-opacity="0.28"/>
    <rect x="556" y="424" width="206" height="14" rx="7" fill-opacity="0.34"/>
    <rect x="556" y="456" width="150" height="14" rx="7" fill-opacity="0.22"/>
    <rect x="556" y="510" width="186" height="22" rx="9" fill-opacity="0.55"/>
    <rect x="556" y="556" width="210" height="14" rx="7" fill-opacity="0.28"/>
    <rect x="556" y="588" width="190" height="14" rx="7" fill-opacity="0.34"/>
    <rect x="556" y="620" width="170" height="14" rx="7" fill-opacity="0.24"/>
    <rect x="556" y="668" width="120" height="14" rx="7" fill-opacity="0.18"/>
  </g>

  <!-- accent balance dot on divider (equilibrium) -->
  <circle cx="511" cy="512" r="18" fill="#0A7A5C"/>
  <circle cx="511" cy="512" r="8" fill="#F6F5F2"/>
</svg>
