name: Equi
options:
  bundleIdPrefix: com.leoxw
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
  # 生成共享 Scheme，避免 Xcode 报 “没有 active scheme”
  createScheme: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Automatic
    # 本地无付费证书时 Hardened Runtime 易导致 CodeSign 失败；正式分发可再打开
    ENABLE_HARDENED_RUNTIME: NO
    PRODUCT_NAME: Equi

targets:
  Equi:
    type: application
    platform: macOS
    sources:
      - path: Equi/App
      - path: Equi/Models
      - path: Equi/Bridge
      - path: Equi/Views
      - path: Equi/Supporting
        excludes:
          - Info.plist
          - "*.entitlements"
    resources:
      # 文件夹引用：保留 Editor/ 目录结构
      - path: Equi/Resources/Editor
        type: folder
        buildPhase: resources
      # 扁平单文件兜底：沙盒 App 读自己 Bundle 根级资源最稳妥
      - path: Equi/Resources/EquiEditor.html
        buildPhase: resources
      - path: Equi/Supporting/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leoxw.Equi
        INFOPLIST_FILE: Equi/Supporting/Info.plist
        CODE_SIGN_ENTITLEMENTS: Equi/Supporting/Equi.entitlements
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      # 显式挂到 Target，确保 Shared Scheme 写入 xcshareddata
      testTargets: []
      gatherCoverageData: false
      commandLineArguments:
        "": true

schemes:
  Equi:
    build:
      targets:
        Equi: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
