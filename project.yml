name: MarkdownDualEditor
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    PRODUCT_NAME: Markdown Dual Editor

targets:
  MarkdownDualEditor:
    type: application
    platform: macOS
    sources:
      - path: MarkdownDualEditor/App
      - path: MarkdownDualEditor/Models
      - path: MarkdownDualEditor/Bridge
      - path: MarkdownDualEditor/Views
      - path: MarkdownDualEditor/Supporting
        excludes:
          - Info.plist
          - "*.entitlements"
    resources:
      - path: MarkdownDualEditor/Resources/Editor
        type: folder
        buildPhase: resources
      - path: MarkdownDualEditor/Supporting/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.MarkdownDualEditor
        INFOPLIST_FILE: MarkdownDualEditor/Supporting/Info.plist
        CODE_SIGN_ENTITLEMENTS: MarkdownDualEditor/Supporting/MarkdownDualEditor.entitlements
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
