name: Equi
options:
  bundleIdPrefix: com.leoxw
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
  # 生成共享 Scheme，避免 Xcode 报 “没有 active scheme”
  createScheme: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Automatic
    # 本地无付费证书时 Hardened Runtime 易导致 CodeSign 失败；正式分发可再打开
    ENABLE_HARDENED_RUNTIME: NO
    PRODUCT_NAME: Equi

targets:
  Equi:
    type: application
    platform: macOS
    sources:
      - path: Equi/App
      - path: Equi/Models
      - path: Equi/Bridge
      - path: Equi/Views
      - path: Equi/Supporting
        excludes:
          - Info.plist
          - "*.entitlements"
    resources:
      # 文件夹引用：保留 Editor/ 目录结构（部分 Xcode/XcodeGen 组合会漏拷，见下方脚本兜底）
      - path: Equi/Resources/Editor
        type: folder
        buildPhase: resources
      # 扁平单文件：Bundle 根级 EquiEditor.html
      - path: Equi/Resources/EquiEditor.html
        buildPhase: resources
      - path: Equi/Supporting/Assets.xcassets
    # 强制把编辑器 HTML 拷进 .app/Contents/Resources（解决 Resources 为空）
    # 使用 postBuildScripts：在 Copy Bundle Resources 之后执行，避免被覆盖/漏拷
    postBuildScripts:
      - name: Embed Editor HTML
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          SRC="${SRCROOT}/Equi/Resources"
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          mkdir -p "${DEST}/Editor"

          if [[ ! -f "${SRC}/EquiEditor.html" ]]; then
            echo "error: 缺少 ${SRC}/EquiEditor.html — 请先运行 ./scripts/build-editor.sh" >&2
            exit 1
          fi
          if [[ ! -f "${SRC}/Editor/index.html" ]]; then
            echo "error: 缺少 ${SRC}/Editor/index.html — 请先运行 ./scripts/build-editor.sh" >&2
            exit 1
          fi

          cp -f "${SRC}/EquiEditor.html" "${DEST}/EquiEditor.html"
          cp -f "${SRC}/Editor/index.html" "${DEST}/Editor/index.html"
          if [[ -d "${SRC}/Editor/assets" ]]; then
            mkdir -p "${DEST}/Editor/assets"
            cp -f "${SRC}/Editor/assets/"* "${DEST}/Editor/assets/" 2>/dev/null || true
          fi

          echo "[Equi] Embedded editor HTML → ${DEST}"
          ls -la "${DEST}/EquiEditor.html" "${DEST}/Editor/index.html"
          # 基本完整性：内联后应远大于 100KB
          SIZE=$(wc -c < "${DEST}/EquiEditor.html" | tr -d ' ')
          if [[ "${SIZE}" -lt 100000 ]]; then
            echo "error: EquiEditor.html 过小 (${SIZE} bytes)，构建可能不完整" >&2
            exit 1
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leoxw.Equi
        INFOPLIST_FILE: Equi/Supporting/Info.plist
        CODE_SIGN_ENTITLEMENTS: Equi/Supporting/Equi.entitlements
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      # 显式挂到 Target，确保 Shared Scheme 写入 xcshareddata
      testTargets: []
      gatherCoverageData: false
      commandLineArguments:
        "": true

schemes:
  Equi:
    build:
      targets:
        Equi: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
